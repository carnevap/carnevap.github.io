<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blue Ribbon — Community Contests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- Firebase (Firestore) — used as the shared database so this works once hosted outside Claude -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#141d27;
    --ink-deep:#0f161e;
    --panel:#1c2a38;
    --panel-raised:#233b4d;
    --paper:#f4efe0;
    --paper-dim:#e7dfc8;
    --cream:#f3eedf;
    --muted:#93a7b7;
    --muted-dim:#5f7381;
    --gold:#e3a63e;
    --gold-dim:#b98530;
    --blue-r:#3d6fe0;
    --red-r:#d5473f;
    --yellow-r:#d9b44a;
    --rose:#d6667b;
    --success:#6fae8a;
    --line: rgba(243,238,223,0.14);
    --shadow: 0 18px 40px rgba(0,0,0,0.35);
    --radius: 14px;
    font-size: 16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 700px at 15% -10%, #1c2b3a 0%, var(--ink) 45%, var(--ink-deep) 100%);
    color: var(--cream);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing: antialiased;
  }
  .display{ font-family:'Anton', sans-serif; letter-spacing:0.5px; text-transform:uppercase; }
  .mono{ font-family:'Space Mono', monospace; }
  a{ color: inherit; }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background: var(--gold); color:#1a1208; }
  :focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- layout shells ---------- */
  #app{ max-width: 1080px; margin: 0 auto; padding: 28px 20px 90px; }
  .top-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:34px; }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
  .brand-mark{ width:34px; height:34px; flex:none; }
  .brand-name{ font-family:'Anton'; font-size:1.35rem; letter-spacing:0.5px; }
  .nav-link{ font-size:0.85rem; color:var(--muted); text-decoration:none; border-bottom:1px dashed transparent; padding-bottom:2px; }
  .nav-link:hover{ color:var(--gold); border-color:var(--gold); }

  /* ---------- perforated / ticket motifs ---------- */
  .tear{
    position:relative;
    border-top:1.5px dashed rgba(243,238,223,0.25);
    margin: 26px 0;
    height:1px;
  }
  .tear::before,.tear::after{
    content:"";
    position:absolute; top:-9px; width:18px; height:18px; border-radius:50%;
    background: var(--ink);
    box-shadow: inset 0 0 0 1.5px rgba(243,238,223,0.18);
  }
  .tear::before{ left:-38px; }
  .tear::after{ right:-38px; }

  .panel{
    background: linear-gradient(180deg, var(--panel), var(--panel-raised));
    border:1px solid rgba(243,238,223,0.08);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  /* ---------- home hero ---------- */
  .hero{ text-align:center; padding: 38px 20px 30px; }
  .hero-eyebrow{ font-family:'Space Mono'; font-size:0.72rem; letter-spacing:3px; color:var(--gold); text-transform:uppercase; }
  .hero h1{ font-size: clamp(2.4rem, 6vw, 4rem); margin: 10px 0 6px; line-height:0.95; }
  .hero p{ color:var(--muted); max-width:480px; margin:0 auto; font-size:0.98rem; }

  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding: 12px 22px; border-radius: 999px; border:none;
    font-weight:700; font-size:0.92rem; letter-spacing:0.2px;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn-primary{ background: var(--gold); color:#241705; box-shadow: 0 8px 18px rgba(227,166,62,0.28); }
  .btn-primary:hover{ transform: translateY(-1px); box-shadow: 0 12px 22px rgba(227,166,62,0.38); }
  .btn-primary:active{ transform: translateY(0px) scale(0.98); }
  .btn-ghost{ background: transparent; color:var(--cream); border:1.5px solid rgba(243,238,223,0.25); }
  .btn-ghost:hover{ border-color: var(--gold); color:var(--gold); }
  .btn-danger{ background: transparent; color:var(--red-r); border:1.5px solid rgba(213,71,63,0.5); }
  .btn-danger:hover{ background: rgba(213,71,63,0.12); }
  .btn-sm{ padding:8px 14px; font-size:0.78rem; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none !important; }
  .btn-block{ width:100%; justify-content:center; }

  /* ---------- event list (home) ---------- */
  .event-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap:18px; margin-top:10px; }
  .event-card{
    padding:22px; text-decoration:none; color:inherit; position:relative; overflow:hidden;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .event-card:hover{ transform: translateY(-3px); }
  .event-card .emoji{ font-size:2.1rem; }
  .event-card h3{ font-family:'Anton'; font-size:1.3rem; margin:10px 0 4px; text-transform:uppercase; }
  .event-card p{ color:var(--muted); font-size:0.85rem; margin:0 0 14px; min-height:1.2em; }
  .status-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .pill{
    font-family:'Space Mono'; font-size:0.68rem; padding:4px 9px; border-radius:999px;
    border:1px solid var(--line); color:var(--muted); letter-spacing:0.3px;
  }
  .pill.on{ color:#0f1a12; background: var(--success); border-color:transparent; }
  .pill.off{ color:var(--muted); }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--muted); }
  .empty-state .glyph{ font-size:2.4rem; margin-bottom:10px; }

  /* ---------- ticket / entry card ---------- */
  .ticket{
    display:grid; grid-template-columns: 1fr 78px;
    background: var(--paper); color:#221a0c; border-radius:12px; overflow:hidden;
    box-shadow: var(--shadow); position:relative;
  }
  .ticket-photo{ aspect-ratio: 4/3; width:100%; object-fit:cover; display:block; background:#00000022; }
  .ticket-body{ padding:14px 14px 16px; display:flex; flex-direction:column; gap:8px; }
  .ticket-body h4{ font-family:'Anton'; font-size:1.05rem; margin:0; text-transform:uppercase; letter-spacing:0.3px; }
  .ticket-stub{
    background: repeating-linear-gradient(180deg, #e7dfc8 0 8px, #ddd3b6 8px 9px);
    border-left: 2px dashed rgba(34,26,12,0.28);
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:12px 6px; text-align:center;
  }
  .ticket-stub .num{ font-family:'Space Mono'; font-weight:700; font-size:0.72rem; writing-mode:vertical-rl; transform:rotate(180deg); letter-spacing:2px; color:#4a3c1e; }
  .ticket-stub .rank-badge{ width:40px; }
  .ticket-actions{ display:flex; gap:8px; margin-top:auto; }
  .vote-btn, .like-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    padding:9px 8px; border-radius:9px; border:1.5px solid rgba(34,26,12,0.18);
    background:#fff8ea; font-weight:700; font-size:0.78rem; color:#3a2e14;
    transition: all .15s ease;
  }
  .vote-btn:hover{ border-color:var(--blue-r); color:var(--blue-r); }
  .vote-btn.active{ background:var(--blue-r); color:#fff; border-color:var(--blue-r); }
  .like-btn:hover{ border-color:var(--rose); color:var(--rose); }
  .like-btn.active{ background:var(--rose); color:#fff; border-color:var(--rose); }
  .vote-btn:disabled, .like-btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .stat-row{ font-family:'Space Mono'; font-size:0.72rem; color:#6b5a34; display:flex; gap:10px; }
  .entry-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap:20px; margin-top:18px; }

  /* ---------- ribbon badge ---------- */
  .ribbon-badge{ display:block; }

  /* ---------- carousel ---------- */
  .carousel{ position:relative; margin-top:22px; }
  .carousel-track-wrap{ overflow:hidden; border-radius: var(--radius); }
  .carousel-track{ display:flex; transition: transform .5s cubic-bezier(.65,0,.35,1); }
  .carousel-slide{ flex:0 0 100%; padding: 34px 26px; text-align:center; position:relative;
    background: linear-gradient(160deg, var(--panel-raised), var(--panel)); }
  .carousel-slide .ribbon-wrap{ width:76px; margin:0 auto 14px; }
  .carousel-slide img{ width:180px; height:180px; object-fit:cover; border-radius:10px; border:4px solid var(--paper); box-shadow:0 10px 24px rgba(0,0,0,0.35); margin-bottom:14px; }
  .carousel-slide h3{ font-family:'Anton'; font-size:1.5rem; margin:4px 0 2px; text-transform:uppercase; }
  .carousel-slide .cs-stats{ color:var(--gold); font-family:'Space Mono'; font-size:0.85rem; }
  .carousel-arrow{
    position:absolute; top:50%; transform:translateY(-50%); width:38px; height:38px; border-radius:50%;
    background: rgba(20,29,39,0.7); border:1px solid var(--line); color:var(--cream); display:flex; align-items:center; justify-content:center;
    font-size:1.1rem; z-index:2;
  }
  .carousel-arrow:hover{ background: var(--gold); color:#241705; }
  .carousel-arrow.prev{ left:8px; } .carousel-arrow.next{ right:8px; }
  .carousel-dots{ display:flex; justify-content:center; gap:7px; margin-top:12px; }
  .carousel-dots button{ width:8px; height:8px; border-radius:50%; border:none; background:rgba(243,238,223,0.25); padding:0; }
  .carousel-dots button.active{ background: var(--gold); width:20px; border-radius:5px; transition: width .2s ease; }

  /* ---------- standings table ---------- */
  .standings-table{ width:100%; border-collapse:collapse; margin-top:18px; }
  .standings-table th{ text-align:left; font-family:'Space Mono'; font-size:0.68rem; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase; padding:0 10px 10px; border-bottom:1px solid var(--line); }
  .standings-table td{ padding:12px 10px; border-bottom:1px solid var(--line); font-size:0.9rem; }
  .standings-table tr:last-child td{ border-bottom:none; }
  .rank-num{ font-family:'Space Mono'; color:var(--muted); font-weight:700; }
  .st-name{ font-weight:600; }
  .st-photo{ width:38px; height:38px; border-radius:7px; object-fit:cover; margin-right:10px; vertical-align:middle; }

  /* ---------- section headers ---------- */
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-top:8px; flex-wrap:wrap; gap:8px;}
  .section-head h2{ font-family:'Anton'; font-size:1.5rem; text-transform:uppercase; margin:0; }
  .section-sub{ color:var(--muted); font-size:0.85rem; }

  /* ---------- forms ---------- */
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:0.78rem; color:var(--muted); margin-bottom:6px; letter-spacing:0.3px; }
  .field input[type=text], .field input[type=email], .field textarea, .field select{
    width:100%; padding:11px 13px; border-radius:9px; border:1.5px solid rgba(243,238,223,0.15);
    background: rgba(15,22,30,0.55); color:var(--cream); font-size:0.92rem; font-family:inherit;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ border-color: var(--gold); }
  .field textarea{ min-height:70px; resize:vertical; }
  .check-row{ display:flex; align-items:flex-start; gap:10px; padding:11px 13px; border:1.5px solid rgba(243,238,223,0.1); border-radius:9px; margin-bottom:10px; background:rgba(15,22,30,0.35); }
  .check-row input{ margin-top:3px; width:16px; height:16px; accent-color: var(--gold); flex:none; }
  .check-row .ct{ font-weight:600; font-size:0.88rem; }
  .check-row .cd{ font-size:0.78rem; color:var(--muted); margin-top:2px; }
  .photo-drop{
    border:1.5px dashed rgba(243,238,223,0.25); border-radius:12px; padding:20px; text-align:center; cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .photo-drop:hover{ border-color: var(--gold); background: rgba(227,166,62,0.05); }
  .photo-drop img{ max-width:100%; max-height:220px; border-radius:8px; }
  .photo-drop .hint{ color:var(--muted); font-size:0.82rem; }

  /* ---------- toast ---------- */
  #toast-wrap{ position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:999; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .toast{
    background: var(--gold); color:#241705; padding:11px 20px; border-radius:999px; font-weight:700; font-size:0.85rem;
    box-shadow: 0 10px 24px rgba(0,0,0,0.35); animation: toast-in .25s ease;
  }
  .toast.err{ background: var(--red-r); color:#fff; }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- admin ---------- */
  .login-wrap{ max-width:360px; margin: 60px auto; padding:34px; text-align:center; }
  .login-wrap .glyph{ font-size:2.4rem; margin-bottom:8px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-top:16px; }
  .stat-box{ padding:16px; text-align:center; }
  .stat-box .n{ font-family:'Anton'; font-size:1.8rem; color:var(--gold); }
  .stat-box .l{ font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-top:2px; }
  .admin-event-row{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line); gap:12px; flex-wrap:wrap; }
  .admin-event-row:last-child{ border-bottom:none; }
  .admin-event-row .name{ font-weight:700; }
  .admin-event-row .meta{ font-size:0.78rem; color:var(--muted); font-family:'Space Mono'; }
  .admin-table{ width:100%; border-collapse:collapse; margin-top:14px; }
  .admin-table th{ text-align:left; font-size:0.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; padding:8px 10px; border-bottom:1px solid var(--line); }
  .admin-table td{ padding:10px; border-bottom:1px solid var(--line); font-size:0.85rem; vertical-align:middle;}
  .admin-thumb{ width:44px; height:44px; border-radius:8px; object-fit:cover; }
  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .bar-row .label{ width:120px; font-size:0.8rem; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ flex:1; height:9px; border-radius:5px; background: rgba(243,238,223,0.08); overflow:hidden; }
  .bar-fill{ height:100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius:5px; }
  .bar-val{ font-family:'Space Mono'; font-size:0.75rem; color:var(--muted); width:34px; text-align:right; flex:none; }
  .tabs{ display:flex; gap:6px; margin: 18px 0; border-bottom:1px solid var(--line); }
  .tab-btn{ background:none; border:none; color:var(--muted); padding:10px 4px; font-weight:600; font-size:0.85rem; border-bottom:2px solid transparent; margin-right:14px; }
  .tab-btn.active{ color:var(--gold); border-color:var(--gold); }
  .modal-overlay{ position:fixed; inset:0; background:rgba(10,14,18,0.7); display:flex; align-items:center; justify-content:center; z-index:200; padding:18px; }
  .modal{ max-width:440px; width:100%; padding:26px; max-height:88vh; overflow-y:auto; }
  .modal h3{ font-family:'Anton'; text-transform:uppercase; margin-top:0; }
  .icon-btn{ background:none; border:none; color:var(--muted); font-size:1rem; padding:6px; }
  .icon-btn:hover{ color:var(--red-r); }
  .banner{ padding:12px 16px; border-radius:9px; font-size:0.82rem; margin-bottom:16px; background: rgba(227,166,62,0.12); border:1px solid rgba(227,166,62,0.3); color:var(--gold); }
  .content-pad{ padding:26px; }
  .small-muted{ color:var(--muted); font-size:0.8rem; }
  hr.hairline{ border:none; border-top:1px solid var(--line); margin:20px 0; }
  code.k{ background:rgba(0,0,0,0.3); padding:2px 6px; border-radius:5px; font-family:'Space Mono'; font-size:0.78rem; }
</style>

<body>
<div id="toast-wrap"></div>
<div id="app"></div>

<script>
/* ============================================================
   FIREBASE CONFIG — paste your project's config here
   (Firebase console → Project settings → Your apps → SDK setup)
   ============================================================ */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
const FIREBASE_CONFIGURED = firebaseConfig.apiKey && firebaseConfig.apiKey !== 'YOUR_API_KEY';
let db = null;
if (FIREBASE_CONFIGURED){
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}
const COLLECTION = 'blueribbon_data';

/* ============================================================
   STORAGE HELPERS (Firestore-backed — one doc per key, { value: ... })
   ============================================================ */
async function sget(key, retries, delayMs){
  retries = retries || 0; delayMs = delayMs || 300;
  for (let attempt=0; attempt<=retries; attempt++){
    try{
      const doc = await db.collection(COLLECTION).doc(key).get();
      if (doc.exists) return doc.data().value;
    }catch(e){ console.error('sget failed', key, e); }
    if (attempt < retries) await new Promise(res=>setTimeout(res, delayMs));
  }
  return null;
}
async function sset(key, val){
  try{
    await db.collection(COLLECTION).doc(key).set({ value: val, updatedAt: Date.now() });
    return true;
  }catch(e){ console.error('sset failed', key, e); return false; }
}

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function esc(str){ const d=document.createElement('div'); d.innerText = str==null?'':String(str); return d.innerHTML; }
function fmtDate(ts){ try{ return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }catch(e){ return ''; } }
function normEmail(e){ return (e||'').trim().toLowerCase(); }

function toast(msg, isErr){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 300); }, 2600);
}

/* ============================================================
   IMAGE COMPRESSION
   ============================================================ */
function fileToCompressedDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim){ height = Math.round(height * (maxDim/width)); width = maxDim; }
        else if (height >= width && height > maxDim){ width = Math.round(width * (maxDim/height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,width,height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   RIBBON BADGE SVG
   ============================================================ */
const RIBBON_COLORS = { 1:'#3d6fe0', 2:'#d5473f', 3:'#d9b44a' };
function ribbonSvg(rank, size){
  size = size || 60;
  const c = RIBBON_COLORS[rank] || '#7a8a99';
  const dark = { 1:'#274a9c', 2:'#95312b', 3:'#a3812f' }[rank] || '#54636f';
  return `<svg class="ribbon-badge" viewBox="0 0 100 130" width="${size}" height="${size*1.3}" xmlns="http://www.w3.org/2000/svg">
    <polygon points="20,60 5,125 32,112 50,128 68,112 95,125 80,60" fill="${dark}"/>
    <circle cx="50" cy="45" r="42" fill="${c}"/>
    <circle cx="50" cy="45" r="42" fill="none" stroke="${dark}" stroke-width="4"/>
    <text x="50" y="58" font-family="Anton, sans-serif" font-size="42" fill="#fff" text-anchor="middle">${rank}</text>
  </svg>`;
}

/* ============================================================
   RENDER SCORE / RANK HELPERS
   ============================================================ */
function rankEntries(entries, votes, likes, settings){
  const voteCounts = {};
  Object.values(votes||{}).forEach(eid => { voteCounts[eid] = (voteCounts[eid]||0) + 1; });
  const withStats = entries.map(e => ({
    ...e,
    voteCount: voteCounts[e.id] || 0,
    likeCount: (likes && likes[e.id]) || 0
  }));
  const useVotes = settings.allowVote;
  const useLikes = settings.allowLikes;
  withStats.sort((a,b)=>{
    if (useVotes && b.voteCount !== a.voteCount) return b.voteCount - a.voteCount;
    if (useLikes && b.likeCount !== a.likeCount) return b.likeCount - a.likeCount;
    return a.submittedAt - b.submittedAt;
  });
  return withStats;
}

/* ============================================================
   APP STATE / ROUTER
   ============================================================ */
const App = {
  adminAuthed: false,
  voterEmailCache: {}, // eventId -> email typed by visitor this session
};

function route(){
  const hash = location.hash || '#/';
  const parts = hash.replace('#/','').split('/').filter(Boolean);
  if (parts[0] === 'event' && parts[1]) return renderEventPage(parts[1]);
  if (parts[0] === 'admin' && parts[1] === 'event' && parts[2]) return renderAdminEvent(parts[2]);
  if (parts[0] === 'admin') return renderAdmin();
  return renderHome();
}
window.addEventListener('hashchange', route);

function setApp(html){ document.getElementById('app').innerHTML = html; window.scrollTo(0,0); }

function topNav(activeLabel){
  return `<div class="top-nav">

  setApp(`<div>

/* ============================================================
   EVENT PAGE (public)
   ============================================================ */
let carouselState = { index: 0, timer: null };

async function renderEventPage(eventId){
  setApp(`<div>${topNav()}<div class="empty-state">Loading contest…</div></div>`);
  const ev = await sget('event:' + eventId, 4, 350);
  if (!ev){
    setApp(`<div>${topNav()}<div class="empty-state"><div class="glyph">🎫</div>Contest not found.<br><a href="#/" class="btn btn-ghost" style="margin-top:14px;">Back home</a></div></div>`);
    return;
  }
  const entries = [];
  for (const eid of ev.entryIds){
    const en = await sget('entry:' + eventId + ':' + eid);
    if (en) entries.push(en);
  }
  const votes = (await sget('votes:' + eventId)) || {};
  const likes = (await sget('likes:' + eventId)) || {};
  const likegivers = (await sget('likegivers:' + eventId)) || {};

  const ranked = rankEntries(entries, votes, likes, ev.settings);
  const top3 = ranked.slice(0,3);
  const rest = ranked.slice(3,10);

  const savedEmail = App.voterEmailCache[eventId] || '';

  setApp(`<div>
    ${topNav()}
    <div class="panel content-pad" style="text-align:center;">
      <div class="hero-eyebrow">${esc(ev.coverEmoji||'🎗️')} Contest Ticket</div>
      <h1 class="display" style="font-size:clamp(1.9rem,5vw,2.8rem); margin:8px 0 4px;">${esc(ev.name)}</h1>
      ${ev.tagline ? `<p class="small-muted" style="font-size:0.95rem;">${esc(ev.tagline)}</p>` : ''}
      <div class="status-row" style="justify-content:center; margin-top:10px;">
        <span class="pill ${ev.settings.submissionsOpen?'on':'off'}">${ev.settings.submissionsOpen?'Entries Open':'Entries Closed'}</span>
        <span class="pill ${ev.settings.votingOpen?'on':'off'}">${ev.settings.votingOpen?'Voting Open':'Voting Closed'}</span>
        ${ev.settings.allowVote ? '<span class="pill">1 vote / email</span>' : ''}
        ${ev.settings.allowLikes ? '<span class="pill">Unlimited likes</span>' : ''}
      </div>
    </div>

    ${ev.settings.submissionsOpen ? `
    <div class="tear"></div>
    <div class="section-head"><h2>Enter the Contest</h2></div>
    <div class="panel content-pad" style="margin-top:12px;">
      <div id="submit-msg"></div>
      <form id="entry-form">
        <div class="field"><label>Your Name</label><input type="text" id="ef-name" required maxlength="60" placeholder="Jamie Rivera"></div>
        <div class="field"><label>Email <span class="small-muted">(one entry per email)</span></label><input type="email" id="ef-email" required placeholder="you@example.com"></div>
        <div class="field">
          <label>Photo</label>
          <div class="photo-drop" id="ef-drop">
            <div id="ef-preview"><span class="hint">📷 Click to choose a photo (auto-resized)</span></div>
          </div>
          <input type="file" id="ef-file" accept="image/*" style="display:none;">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Submit Entry</button>
      </form>
    </div>` : ''}

    <div class="tear"></div>
    <div class="section-head">
      <h2>🏆 Current Standings</h2>
      <span class="section-sub">${entries.length} entr${entries.length===1?'y':'ies'}</span>
    </div>
    ${entries.length === 0 ? `<div class="empty-state"><div class="glyph">🎗️</div>No entries yet — be the first!</div>` : renderStandingsBlock(top3, rest, ev.settings)}

    <div class="tear"></div>
    <div class="section-head">
      <h2>🖼️ Gallery ${ev.settings.votingOpen ? '& Voting' : ''}</h2>
      <span class="section-sub">${ev.settings.votingOpen ? 'Cast your vote below' : 'Voting is currently closed'}</span>
    </div>
    ${(ev.settings.allowVote || ev.settings.allowLikes) && ev.settings.votingOpen ? `
      <div class="field" style="max-width:340px; margin-top:12px;">
        <label>Your Email <span class="small-muted">(to vote / like)</span></label>
        <input type="email" id="voter-email" placeholder="you@example.com" value="${esc(savedEmail)}">
      </div>` : ''}
    ${entries.length === 0 ? '' : `<div class="entry-grid" id="entry-gallery"></div>`}
  </div>`);

  if (entries.length){
    renderGallery(eventId, ranked, ev.settings, votes, likes, likegivers);
  }

  if (ev.settings.submissionsOpen){
    setupEntryForm(eventId, ev);
  }

  if (top3.length){
    setupCarousel(top3);
  }
}

function renderStandingsBlock(top3, rest, settings){
  const slides = top3.map((e,i) => `
    <div class="carousel-slide">
      <div class="ribbon-wrap">${ribbonSvg(i+1, 76)}</div>
      <img src="${e.photo}" alt="${esc(e.name)}">
      <h3>${esc(e.name)}</h3>
      <div class="cs-stats">${settings.allowVote ? e.voteCount + ' vote' + (e.voteCount===1?'':'s') : ''}${settings.allowVote && settings.allowLikes ? ' · ' : ''}${settings.allowLikes ? '♥ ' + e.likeCount : ''}</div>
    </div>
  `).join('');
  const dots = top3.map((_,i)=>`<button class="${i===0?'active':''}" data-dot="${i}" aria-label="Slide ${i+1}"></button>`).join('');

  const tableRows = rest.map((e,i)=>`
    <tr>
      <td class="rank-num">#${i+4}</td>
      <td><img class="st-photo" src="${e.photo}" alt=""><span class="st-name">${esc(e.name)}</span></td>
      ${settings.allowVote ? `<td class="mono">${e.voteCount}</td>` : ''}
      ${settings.allowLikes ? `<td class="mono">♥ ${e.likeCount}</td>` : ''}
    </tr>
  `).join('');

  return `
    <div class="carousel" id="standings-carousel">
      <div class="carousel-track-wrap">
        <div class="carousel-track" id="carousel-track">${slides}</div>
      </div>
      ${top3.length>1 ? `
      <button class="carousel-arrow prev" id="car-prev">‹</button>
      <button class="carousel-arrow next" id="car-next">›</button>
      <div class="carousel-dots" id="carousel-dots">${dots}</div>` : ''}
    </div>
    ${rest.length ? `
    <table class="standings-table">
      <thead><tr>
        <th>Rank</th><th>Entry</th>
        ${settings.allowVote ? '<th>Votes</th>' : ''}
        ${settings.allowLikes ? '<th>Likes</th>' : ''}
      </tr></thead>
      <tbody>${tableRows}</tbody>
    </table>` : ''}
  `;
}

function setupCarousel(top3){
  carouselState.index = 0;
  clearInterval(carouselState.timer);
  const track = document.getElementById('carousel-track');
  const dotsWrap = document.getElementById('carousel-dots');
  if (!track) return;
  function go(i){
    carouselState.index = (i + top3.length) % top3.length;
    track.style.transform = `translateX(-${carouselState.index*100}%)`;
    if (dotsWrap) [...dotsWrap.children].forEach((d,idx)=> d.classList.toggle('active', idx===carouselState.index));
  }
  document.getElementById('car-prev')?.addEventListener('click', ()=> go(carouselState.index-1));
  document.getElementById('car-next')?.addEventListener('click', ()=> go(carouselState.index+1));
  dotsWrap?.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=> go(parseInt(btn.dataset.dot,10)));
  });
  if (top3.length > 1){
    carouselState.timer = setInterval(()=> go(carouselState.index+1), 4500);
    document.getElementById('standings-carousel').addEventListener('mouseenter', ()=> clearInterval(carouselState.timer));
    document.getElementById('standings-carousel').addEventListener('mouseleave', ()=>{
      clearInterval(carouselState.timer);
      carouselState.timer = setInterval(()=> go(carouselState.index+1), 4500);
    });
  }
}

function renderGallery(eventId, ranked, settings, votes, likes, likegivers){
  const wrap = document.getElementById('entry-gallery');
  if (!wrap) return;
  wrap.innerHTML = ranked.map((e, idx) => {
    const rank = idx+1;
    const myVoteBtn = settings.allowVote ? `<button class="vote-btn" data-vote="${e.id}">☑ Vote</button>` : '';
    const myLikeBtn = settings.allowLikes ? `<button class="like-btn" data-like="${e.id}">👍 ${e.likeCount}</button>` : '';
    return `
    <div class="ticket">
      <img class="ticket-photo" src="${e.photo}" alt="${esc(e.name)}">
      <div class="ticket-body">
        <h4>${esc(e.name)}</h4>
        <div class="stat-row">${settings.allowVote ? `<span>${e.voteCount} vote${e.voteCount===1?'':'s'}</span>`:''}${settings.allowLikes?`<span>♥ ${e.likeCount}</span>`:''}</div>
        <div class="ticket-actions">
          ${settings.votingOpen ? myVoteBtn + myLikeBtn : '<span class="small-muted" style="font-size:0.72rem;">Voting closed</span>'}
        </div>
      </div>
      <div class="ticket-stub">
        <div class="num">No. ${String(idx+1).padStart(3,'0')}</div>
        ${rank<=3 ? ribbonSvg(rank, 30) : `<div class="mono" style="font-size:0.7rem;color:#6b5a34;">#${rank}</div>`}
      </div>
    </div>`;
  }).join('');

  if (!settings.votingOpen) return;

  function getEmail(){
    const input = document.getElementById('voter-email');
    const val = normEmail(input ? input.value : '');
    if (!val){ toast('Enter your email first', true); input?.focus(); return null; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)){ toast('Enter a valid email', true); input?.focus(); return null; }
    App.voterEmailCache[eventId] = val;
    return val;
  }

  wrap.querySelectorAll('[data-vote]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const email = getEmail(); if (!email) return;
      btn.disabled = true;
      const currentVotes = (await sget('votes:'+eventId)) || {};
      currentVotes[email] = btn.dataset.vote;
      await sset('votes:'+eventId, currentVotes);
      toast('Your vote is in! 🎟️');
      renderEventPage(eventId);
    });
  });
  wrap.querySelectorAll('[data-like]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const email = getEmail(); if (!email) return;
      btn.disabled = true;
      const entryId = btn.dataset.like;
      const givers = (await sget('likegivers:'+eventId)) || {};
      const likesObj = (await sget('likes:'+eventId)) || {};
      const mine = givers[email] || [];
      const already = mine.includes(entryId);
      if (already){
        givers[email] = mine.filter(x=>x!==entryId);
        likesObj[entryId] = Math.max(0, (likesObj[entryId]||0) - 1);
      } else {
        givers[email] = [...mine, entryId];
        likesObj[entryId] = (likesObj[entryId]||0) + 1;
      }
      await sset('likegivers:'+eventId, givers);
      await sset('likes:'+eventId, likesObj);
      toast(already ? 'Like removed' : 'Liked! 👍');
      renderEventPage(eventId);
    });
  });
}

function setupEntryForm(eventId, ev){
  let photoDataUrl = null;
  const drop = document.getElementById('ef-drop');
  const fileInput = document.getElementById('ef-file');
  const preview = document.getElementById('ef-preview');
  drop.addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', async ()=>{
    const file = fileInput.files[0];
    if (!file) return;
    preview.innerHTML = `<span class="hint">Compressing…</span>`;
    try{
      photoDataUrl = await fileToCompressedDataUrl(file, 900, 0.72);
      preview.innerHTML = `<img src="${photoDataUrl}" alt="preview">`;
    }catch(e){
      toast('Could not read that image', true);
      preview.innerHTML = `<span class="hint">📷 Click to choose a photo (auto-resized)</span>`;
    }
  });

  document.getElementById('entry-form').addEventListener('submit', async (ev2)=>{
    ev2.preventDefault();
    const msg = document.getElementById('submit-msg');
    msg.innerHTML = '';
    const name = document.getElementById('ef-name').value.trim();
    const email = normEmail(document.getElementById('ef-email').value);
    if (!name){ toast('Enter your name', true); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('Enter a valid email', true); return; }
    if (!photoDataUrl){ toast('Add a photo to enter', true); return; }

    const freshEv = await sget('event:'+eventId);
    for (const eid of freshEv.entryIds){
      const en = await sget('entry:'+eventId+':'+eid);
      if (en && normEmail(en.email) === email){
        msg.innerHTML = `<div class="banner" style="background:rgba(213,71,63,0.12); border-color:rgba(213,71,63,0.3); color:var(--red-r);">This email has already submitted an entry to this contest.</div>`;
        return;
      }
    }

    const entryId = uid();
    const entry = { id: entryId, name, email, photo: photoDataUrl, submittedAt: Date.now() };
    const ok = await sset('entry:'+eventId+':'+entryId, entry);
    if (!ok){ toast('Could not save entry — try a smaller photo', true); return; }
    freshEv.entryIds.push(entryId);
    await sset('event:'+eventId, freshEv);
    toast('Entry submitted — good luck! 🎃');
    renderEventPage(eventId);
  });
}

async function renderAdmin(){
  if (!App.adminAuthed){
    setApp(`<div>${topNav('admin')}
      <div class="panel login-wrap">
        <div class="glyph">🔐</div>
        <h2 class="display" style="margin:4px 0 2px;">Admin Login</h2>
        <p class="small-muted" id="login-hint">Enter the admin password.</p>
        <form id="login-form" style="margin-top:16px;">
          <div class="field"><input type="password" id="login-pass" placeholder="Password" required autofocus></div>
          <button class="btn btn-primary btn-block" type="submit">Enter</button>
        </form>
      </div>
    </div>`);
    const cfg = await sget('admin-config');
    if (!cfg){
      document.getElementById('login-hint').innerHTML = `First time here? Default password is <code class="k">blueribbon</code> — change it after logging in.`;
    }
    document.getElementById('login-form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const val = document.getElementById('login-pass').value;
      const current = (await sget('admin-config')) || { password: 'blueribbon' };
      if (val === current.password){
        App.adminAuthed = true;
        renderAdminDashboard();
      } else {
        toast('Incorrect password', true);
      }
    });
    return;
  }
  renderAdminDashboard();
}

/* ============================================================
   ADMIN — DASHBOARD
   ============================================================ */
async function renderAdminDashboard(){
  setApp(`<div>${topNav('admin')}<div class="empty-state">Loading dashboard…</div></div>`);
  const index = (await sget('events-index')) || [];
  index.sort((a,b)=> b.createdAt - a.createdAt);

  let totalEntries = 0, totalVotes = 0, totalLikes = 0;
  const rows = [];
  for (const ev of index){
    const full = await sget('event:'+ev.id);
    const entryCount = full ? full.entryIds.length : 0;
    const votes = (await sget('votes:'+ev.id)) || {};
    const likes = (await sget('likes:'+ev.id)) || {};
    const voteCount = Object.keys(votes).length;
    const likeCount = Object.values(likes).reduce((a,b)=>a+b,0);
    totalEntries += entryCount; totalVotes += voteCount; totalLikes += likeCount;
    rows.push({ ev, entryCount, voteCount, likeCount });
  }

  setApp(`<div>
    ${topNav('admin')}
    <div class="section-head"><h2>Admin Dashboard</h2>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost btn-sm" id="btn-settings">⚙ Settings</button>
        <button class="btn btn-primary btn-sm" id="btn-new-event">+ New Event</button>
      </div>
    </div>
    <div class="stat-grid">
      <div class="panel stat-box"><div class="n">${index.length}</div><div class="l">Events</div></div>
      <div class="panel stat-box"><div class="n">${totalEntries}</div><div class="l">Entries</div></div>
      <div class="panel stat-box"><div class="n">${totalVotes}</div><div class="l">Voters</div></div>
      <div class="panel stat-box"><div class="n">${totalLikes}</div><div class="l">Likes</div></div>
    </div>
    <div class="tear"></div>
    <div class="panel">
      ${rows.length === 0 ? `<div class="empty-state"><div class="glyph">🎪</div>No events yet. Create your first one.</div>` :
        rows.map(r => `
        <div class="admin-event-row">
          <div>
            <div class="name">${esc(r.ev.coverEmoji||'')} ${esc(r.ev.name)}</div>
            <div class="meta">${r.entryCount} entries · ${r.voteCount} voters · ${r.likeCount} likes · created ${fmtDate(r.ev.createdAt)}</div>
          </div>
          <div style="display:flex; gap:8px;">
            <a href="#/event/${r.ev.id}" class="btn btn-ghost btn-sm" target="_blank" rel="noopener">View Public</a>
            <a href="#/admin/event/${r.ev.id}" class="btn btn-primary btn-sm">Manage</a>
          </div>
        </div>`).join('')
      }
    </div>
  </div>`);

  document.getElementById('btn-new-event').addEventListener('click', openNewEventModal);
  document.getElementById('btn-settings').addEventListener('click', openAdminSettingsModal);
}

function openModal(innerHtml){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="panel modal">${innerHtml}</div>`;
  overlay.addEventListener('click', (e)=>{ if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  return overlay;
}

function openNewEventModal(){
  const overlay = openModal(`
    <h3>New Contest</h3>
    <form id="new-event-form">
      <div class="field"><label>Contest Name</label><input type="text" id="ne-name" required maxlength="60" placeholder="Pumpkin Carving Contest 2026"></div>
      <div class="field"><label>Tagline <span class="small-muted">(optional)</span></label><input type="text" id="ne-tagline" maxlength="90" placeholder="Carve it up and win bragging rights"></div>
      <div class="field"><label>Cover Emoji</label>
        <select id="ne-emoji">
          <option value="🎃">🎃 Pumpkin</option>
          <option value="🎗️">🎗️ Ribbon</option>
          <option value="📸">📸 Photo</option>
          <option value="🎨">🎨 Art</option>
          <option value="🍰">🍰 Baking</option>
          <option value="🎄">🎄 Holiday</option>
          <option value="🐾">🐾 Pets</option>
          <option value="🏆">🏆 Trophy</option>
        </select>
      </div>
      <div class="check-row"><input type="checkbox" id="ne-submissions" checked><div><div class="ct">Accept entries now</div><div class="cd">Visitors can submit photos right away</div></div></div>
      <div class="check-row"><input type="checkbox" id="ne-voting" checked><div><div class="ct">Open voting now</div><div class="cd">Visitors can vote / like right away</div></div></div>
      <div class="check-row"><input type="checkbox" id="ne-allowvote" checked><div><div class="ct">Voting style: 1 vote per email</div><div class="cd">Each email picks exactly one favorite</div></div></div>
      <div class="check-row"><input type="checkbox" id="ne-allowlikes"><div><div class="ct">Voting style: Unlimited likes 👍</div><div class="cd">Each email can like as many entries as they want (once per entry)</div></div></div>
      <div style="display:flex; gap:10px; margin-top:6px;">
        <button type="button" class="btn btn-ghost" id="ne-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary btn-block">Create Contest</button>
      </div>
    </form>
  `);
  overlay.querySelector('#ne-cancel').addEventListener('click', ()=> overlay.remove());
  overlay.querySelector('#new-event-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const name = overlay.querySelector('#ne-name').value.trim();
    if (!name){ toast('Enter a contest name', true); return; }
    const id = uid();
    const meta = {
      id, name,
      tagline: overlay.querySelector('#ne-tagline').value.trim(),
      coverEmoji: overlay.querySelector('#ne-emoji').value,
      createdAt: Date.now(),
      status: 'active',
      settings: {
        submissionsOpen: overlay.querySelector('#ne-submissions').checked,
        votingOpen: overlay.querySelector('#ne-voting').checked,
        allowVote: overlay.querySelector('#ne-allowvote').checked,
        allowLikes: overlay.querySelector('#ne-allowlikes').checked,
      }
    };
    const full = { ...meta, entryIds: [] };
    const submitBtn = overlay.querySelector('button[type=submit]');
    submitBtn.disabled = true; submitBtn.textContent = 'Creating…';
    const ok = await sset('event:'+id, full);
    if (!ok){
      toast('Could not create contest — check your connection and try again', true);
      submitBtn.disabled = false; submitBtn.textContent = 'Create Contest';
      return;
    }
    const index = (await sget('events-index')) || [];
    index.push({ id, name: meta.name, tagline: meta.tagline, coverEmoji: meta.coverEmoji, createdAt: meta.createdAt, status: 'active', settings: meta.settings });
    await sset('events-index', index);
    // confirm the write is actually readable before navigating away
    const confirmed = await sget('event:'+id, 4, 300);
    overlay.remove();
    if (!confirmed){
      toast('Contest saved, but is taking a moment to sync — opening it now', false);
    } else {
      toast('Contest created 🎉');
    }
    location.hash = '#/admin/event/'+id;
  });
}

  const overlay = openModal(`
    <h3>Admin Settings</h3>
    <form id="pw-form">
      <div class="field"><label>Current Password</label><input type="password" id="pw-current" required></div>
      <div class="field"><label>New Password</label><input type="password" id="pw-new" required minlength="4"></div>
      <div style="display:flex; gap:10px;">
        <button type="button" class="btn btn-ghost" id="pw-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary btn-block">Update Password</button>
      </div>
    </form>
  `);
  overlay.querySelector('#pw-cancel').addEventListener('click', ()=> overlay.remove());
  overlay.querySelector('#pw-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const cfg = (await sget('admin-config')) || { password: 'blueribbon' };
    const curr = overlay.querySelector('#pw-current').value;
    if (curr !== cfg.password){ toast('Current password is incorrect', true); return; }
    const next = overlay.querySelector('#pw-new').value;
    await sset('admin-config', { password: next });
    toast('Password updated');
    overlay.remove();
  });
}

/* ============================================================
   ADMIN — EVENT DETAIL
   ============================================================ */
let adminEventTab = 'entries';

async function renderAdminEvent(eventId){
  if (!App.adminAuthed){ location.hash = '#/admin'; return; }
  setApp(`<div>${topNav('admin')}<div class="empty-state">Loading…</div></div>`);
  const ev = await sget('event:'+eventId, 4, 350);
  if (!ev){
    setApp(`<div>${topNav('admin')}<div class="empty-state">Event not found. <a href="#/admin" class="btn btn-ghost" style="margin-top:10px;">Back</a></div></div>`);
    return;
  }
  const entries = [];
  for (const eid of ev.entryIds){ const en = await sget('entry:'+eventId+':'+eid); if (en) entries.push(en); }
  const votes = (await sget('votes:'+eventId)) || {};
  const likes = (await sget('likes:'+eventId)) || {};
  const ranked = rankEntries(entries, votes, likes, ev.settings);
  const maxVal = Math.max(1, ...ranked.map(e => ev.settings.allowVote ? e.voteCount : e.likeCount));

  setApp(`<div>
    ${topNav('admin')}
    <div class="section-head">
      <h2>${esc(ev.coverEmoji)} ${esc(ev.name)}</h2>
      <div style="display:flex; gap:8px;">
        <a href="#/event/${eventId}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">View Public Page ↗</a>
        <a href="#/admin" class="btn btn-ghost btn-sm">← All Events</a>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn ${adminEventTab==='entries'?'active':''}" data-tab="entries">Entries</button>
      <button class="tab-btn ${adminEventTab==='stats'?'active':''}" data-tab="stats">Stats</button>
      <button class="tab-btn ${adminEventTab==='settings'?'active':''}" data-tab="settings">Settings & Permissions</button>
      <button class="tab-btn ${adminEventTab==='danger'?'active':''}" data-tab="danger">Danger Zone</button>
    </div>

    <div id="admin-tab-body"></div>
  </div>`);

  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ adminEventTab = btn.dataset.tab; renderAdminEvent(eventId); });
  });

  const body = document.getElementById('admin-tab-body');

  if (adminEventTab === 'entries'){
    body.innerHTML = entries.length === 0 ? `<div class="empty-state"><div class="glyph">📭</div>No entries yet.</div>` : `
    <div class="panel content-pad">
    <table class="admin-table">
      <thead><tr><th>Photo</th><th>Name</th><th>Email</th><th>Submitted</th>${ev.settings.allowVote?'<th>Votes</th>':''}${ev.settings.allowLikes?'<th>Likes</th>':''}<th></th></tr></thead>
      <tbody>
        ${ranked.map(e => `
          <tr>
            <td><img class="admin-thumb" src="${e.photo}" alt=""></td>
            <td>${esc(e.name)}</td>
            <td class="mono" style="font-size:0.78rem;">${esc(e.email)}</td>
            <td class="small-muted">${fmtDate(e.submittedAt)}</td>
            ${ev.settings.allowVote ? `<td class="mono">${e.voteCount}</td>`:''}
            ${ev.settings.allowLikes ? `<td class="mono">${e.likeCount}</td>`:''}
            <td><button class="icon-btn" data-remove="${e.id}" title="Remove entry">✕</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    </div>`;
    body.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const entryId = btn.dataset.remove;
        if (!confirm('Remove this entry? This also removes its votes and likes.')) return;
        const freshEv = await sget('event:'+eventId);
        freshEv.entryIds = freshEv.entryIds.filter(x=>x!==entryId);
        await sset('event:'+eventId, freshEv);
        const v = (await sget('votes:'+eventId)) || {};
        for (const k of Object.keys(v)) if (v[k]===entryId) delete v[k];
        await sset('votes:'+eventId, v);
        const lk = (await sget('likes:'+eventId)) || {};
        delete lk[entryId];
        await sset('likes:'+eventId, lk);
        toast('Entry removed');
        renderAdminEvent(eventId);
      });
    });
  }

  else if (adminEventTab === 'stats'){
    body.innerHTML = `
      <div class="stat-grid">
        <div class="panel stat-box"><div class="n">${entries.length}</div><div class="l">Entries</div></div>
        ${ev.settings.allowVote ? `<div class="panel stat-box"><div class="n">${Object.keys(votes).length}</div><div class="l">Voters</div></div>`:''}
        ${ev.settings.allowLikes ? `<div class="panel stat-box"><div class="n">${Object.values(likes).reduce((a,b)=>a+b,0)}</div><div class="l">Total Likes</div></div>`:''}
      </div>
      <div class="panel content-pad" style="margin-top:16px;">
        <div class="section-sub" style="margin-bottom:14px;">${ev.settings.allowVote ? 'Votes' : 'Likes'} by entry</div>
        ${ranked.length === 0 ? '<div class="small-muted">No data yet.</div>' : ranked.map(e=>{
          const val = ev.settings.allowVote ? e.voteCount : e.likeCount;
          return `<div class="bar-row">
            <div class="label">${esc(e.name)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${(val/maxVal*100)}%;"></div></div>
            <div class="bar-val">${val}</div>
          </div>`;
        }).join('')}
      </div>
    `;
  }

  else if (adminEventTab === 'settings'){
    body.innerHTML = `
      <div class="panel content-pad">
        <div class="field"><label>Contest Name</label><input type="text" id="es-name" value="${esc(ev.name)}"></div>
        <div class="field"><label>Tagline</label><input type="text" id="es-tagline" value="${esc(ev.tagline||'')}"></div>
        <hr class="hairline">
        <div class="section-sub" style="margin-bottom:10px;">Permissions</div>
        <div class="check-row"><input type="checkbox" id="es-submissions" ${ev.settings.submissionsOpen?'checked':''}><div><div class="ct">Accept entries</div><div class="cd">Allow new photo submissions</div></div></div>
        <div class="check-row"><input type="checkbox" id="es-voting" ${ev.settings.votingOpen?'checked':''}><div><div class="ct">Open voting</div><div class="cd">Allow votes / likes to be cast</div></div></div>
        <div class="check-row"><input type="checkbox" id="es-allowvote" ${ev.settings.allowVote?'checked':''}><div><div class="ct">Voting style: 1 vote per email</div><div class="cd">Each email can pick exactly one favorite entry</div></div></div>
        <div class="check-row"><input type="checkbox" id="es-allowlikes" ${ev.settings.allowLikes?'checked':''}><div><div class="ct">Voting style: Unlimited likes 👍</div><div class="cd">Each email can like as many entries as they want (once per entry)</div></div></div>
        <button class="btn btn-primary" id="es-save">Save Changes</button>
      </div>
    `;
    document.getElementById('es-save').addEventListener('click', async ()=>{
      const freshEv = await sget('event:'+eventId);
      freshEv.name = document.getElementById('es-name').value.trim() || freshEv.name;
      freshEv.tagline = document.getElementById('es-tagline').value.trim();
      freshEv.settings = {
        submissionsOpen: document.getElementById('es-submissions').checked,
        votingOpen: document.getElementById('es-voting').checked,
        allowVote: document.getElementById('es-allowvote').checked,
        allowLikes: document.getElementById('es-allowlikes').checked,
      };
      await sset('event:'+eventId, freshEv);
      const index = (await sget('events-index')) || [];
      const idx = index.findIndex(x=>x.id===eventId);
      if (idx>-1){ index[idx] = { ...index[idx], name: freshEv.name, tagline: freshEv.tagline, settings: freshEv.settings }; await sset('events-index', index); }
      toast('Settings saved');
      renderAdminEvent(eventId);
    });
  }

  else if (adminEventTab === 'danger'){
    body.innerHTML = `
      <div class="panel content-pad">
        <div class="section-sub" style="margin-bottom:10px; color:var(--red-r);">Delete this contest</div>
        <p class="small-muted">This permanently removes the event, all entries, votes and likes. This cannot be undone.</p>
        <button class="btn btn-danger" id="es-delete">Delete Contest</button>
      </div>
    `;
    document.getElementById('es-delete').addEventListener('click', async ()=>{
      if (!confirm('Delete "'+ev.name+'" permanently? This cannot be undone.')) return;
      for (const eid of ev.entryIds){
        // best-effort cleanup; entries are namespaced so left-behind keys are harmless if delete fails
      }
      const index = (await sget('events-index')) || [];
      await sset('events-index', index.filter(x=>x.id!==eventId));
      toast('Contest deleted');
      location.hash = '#/admin';
    });
  }
}

   INIT

  document.getElementById('app').innerHTML = `
    <div>
      ${topNav()}
      <div class="panel content-pad" style="max-width:560px; margin:40px auto; text-align:left;">
        <div style="font-size:2rem; text-align:center;">🔧</div>
        <h2 class="display" style="text-align:center; margin:6px 0 16px;">Almost there</h2>
        <p class="small-muted">This app needs a free Firebase project to store entries and votes. Open <code class="k">contest-app.html</code> in a text editor and paste your config into the <code class="k">firebaseConfig</code> object near the top of the script.</p>
        <ol class="small-muted" style="line-height:1.9; padding-left:20px;">
          <li>Go to <span class="mono">console.firebase.google.com</span> → Create a project (free)</li>
          <li>Build → Firestore Database → Create database (start in test mode)</li>
          <li>Project settings → Your apps → Web app (&lt;/&gt;) → copy the config object</li>
          <li>Paste it into <code class="k">firebaseConfig</code> in this file, save, and reload</li>
        </ol>
        <p class="small-muted">Then set Firestore's rules to allow this public app to read/write (Firestore → Rules):</p>
        <pre class="mono" style="background:rgba(0,0,0,0.35); padding:12px; border-radius:8px; font-size:0.72rem; overflow-x:auto; white-space:pre-wrap;">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /{document=**} {
      allow read, write: if true;
    }
  }
}</pre>
        <p class="small-muted">This keeps the app fully public with no login for voters — matching how it already works. Anyone with your config could technically read/write the database directly, which is normal for a small public tool like this, just worth knowing.</p>
      </div>
    </div>`;
} else {
  route();
